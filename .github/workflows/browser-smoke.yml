name: KC KuTo Browser Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start static development site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .. > /tmp/kuto-http.log 2>&1 &
          echo $! > /tmp/kuto-http.pid
          sleep 2
      - name: Run desktop and mobile smoke tests
        run: |
          mkdir -p test-artifacts
          SITE_URL=http://127.0.0.1:4173/kc-kuto-crm/ node tests/smoke.mjs
          SITE_URL=http://127.0.0.1:4173/kc-kuto-crm/ node tests/settings-smoke.mjs
          SITE_URL=http://127.0.0.1:4173/kc-kuto-crm/ node tests/master-data-smoke.mjs
          SITE_URL=http://127.0.0.1:4173/kc-kuto-crm/ node tests/settings-workspace-smoke.mjs
          SITE_URL=http://127.0.0.1:4173/kc-kuto-crm/ node tests/workspace-theme-smoke.mjs
          SITE_URL=http://127.0.0.1:4173/kc-kuto-crm/ node tests/navigation-smoke.mjs
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kc-kuto-smoke-screenshots-${{ matrix.round }}
          path: test-artifacts/
          if-no-files-found: ignore
